name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html game.js styles.css favicon.svg og.jpg x-banner.jpg _site/
          cp -r maps _site/maps
          cp -r mood-exchange _site/mood-exchange
          cp -r apex-jade-onyx-harbor _site/apex-jade-onyx-harbor
          test -f _site/index.html
          grep -q "八號風球" _site/index.html
          test -f _site/mood-exchange/index.html
          grep -q "心情買賣器" _site/mood-exchange/index.html
          test -f _site/apex-jade-onyx-harbor/index.html
          test -f _site/apex-jade-onyx-harbor/app.js
          test -f _site/apex-jade-onyx-harbor/audio/market-ticker.mp3
          grep -q "港股模擬盤" _site/apex-jade-onyx-harbor/index.html
          grep -q "market-ticker.mp3" _site/apex-jade-onyx-harbor/app.js
          grep -q "rollExtreme" _site/apex-jade-onyx-harbor/app.js
          node --check _site/apex-jade-onyx-harbor/app.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
